<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stories of Islam</title>
    <meta http-equiv="refresh" content="0; url=https://storiesoflislam.afroclovers.com.ng/" />
    <link rel="canonical" href="https://storiesoflislam.afroclovers.com.ng/" />
    <style>
      :root {
        color-scheme: light dark;
        --ink: #14201c;
        --muted: #44554f;
        --emerald: #0f766e;
        --paper: #f4f7f5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e8f0ec;
          --muted: #9bb0a7;
          --paper: #0c1411;
        }
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(circle at top, rgba(15, 118, 110, 0.18), transparent 42%),
          var(--paper);
        color: var(--ink);
      }
      main {
        max-width: 34rem;
        margin: 0 auto;
        padding: 18vh 1.25rem 3rem;
        text-align: center;
      }
      p.brand {
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--emerald);
        margin: 0 0 0.75rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 6vw, 2.7rem);
        line-height: 1.1;
        letter-spacing: -0.03em;
      }
      p.copy {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.55;
      }
      a.cta {
        display: inline-block;
        background: var(--emerald);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        padding: 0.9rem 1.25rem;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Afroclovers · Stories of Islam</p>
      <h1>Stories of Islam</h1>
      <p class="copy">
        Opening the official Stories of Islam site. If you are not redirected,
        continue below.
      </p>
      <a class="cta" href="https://storiesoflislam.afroclovers.com.ng/">Continue to Stories of Islam</a>
    </main>
    <script>
      location.replace('https://storiesoflislam.afroclovers.com.ng/');
    </script>
  </body>
</html>
