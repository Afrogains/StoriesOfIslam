groups:
  - name: stories-api
    rules:
      - alert: StoriesApiNotReady
        expr: probe_success{job="blackbox-api-ready"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: API /health/ready probe is failing

      - alert: StoriesApiHighErrorRate
        expr: |
          sum(rate(stories_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(stories_http_requests_total[5m])), 0.001) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API 5xx rate above 5% for 10 minutes

      - alert: StoriesWorkerQueueBacklog
        expr: stories_generation_jobs_queued > 25
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: Generation job queue backlog is elevated

      - alert: StoriesProviderSpendSpike
        expr: increase(stories_provider_spend_usd[1h]) > 25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: AI/TTS provider spend exceeded the hourly budget signal
