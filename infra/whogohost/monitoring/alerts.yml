groups:
  - name: stories-whogohost
    rules:
      - alert: StoriesDiskNearlyFull
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.25
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: WhoGoHost root filesystem below 25% free

      - alert: StoriesPostgresDown
        expr: up{job="postgres-exporter"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL exporter unreachable on WhoGoHost

      - alert: StoriesKeycloakDiscoveryFailing
        expr: probe_success{job="blackbox-keycloak"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Keycloak OIDC discovery probe failing

      - alert: StoriesMinioUnreachable
        expr: probe_success{job="blackbox-minio"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: MinIO public media health probe failing

      - alert: StoriesCertificateExpiring
        expr: probe_ssl_earliest_cert_expiry{job=~"blackbox-.*"} - time() < 21 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: TLS certificate expires in less than 21 days

      - alert: StoriesBackupMissed
        expr: time() - stories_last_successful_backup_timestamp > 36 * 3600
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: Encrypted off-site backup is older than 36 hours

      - alert: StoriesContainerUnhealthy
        expr: engine_daemon_container_states_containers{state="unhealthy"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: One or more WhoGoHost containers are unhealthy
