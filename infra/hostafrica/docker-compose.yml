name: stories-platform

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stories_of_islam}
      POSTGRES_USER: ${POSTGRES_USER:-stories_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-keycloak.sh:ro
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-stories_app} -d ${POSTGRES_DB:-stories_of_islam}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    command:
      [
        "start",
        "--import-realm",
        "--proxy-headers=xforwarded",
        "--http-enabled=true",
        "--hostname-strict=true",
      ]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://${AUTH_HOSTNAME:?set AUTH_HOSTNAME}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep 'HTTP/1.1 200' <&3",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  # If quay.io returns 401 in a restricted network, pull the same tag on the
  # HostAfrica VPS (or mirror it) before `compose up`.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: https://${MEDIA_HOSTNAME:?set MEDIA_HOSTNAME}
      MINIO_BROWSER_REDIRECT_URL: https://${MINIO_CONSOLE_HOSTNAME:?set MINIO_CONSOLE_HOSTNAME}
    volumes:
      - minio-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z
    restart: "no"
    entrypoint: ["/bin/sh", "/config/bootstrap-minio.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes:
      - ./minio/bootstrap-minio.sh:/config/bootstrap-minio.sh:ro
      - ./minio/api-policy.json:/config/api-policy.json:ro
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - internal

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      AUTH_HOSTNAME: ${AUTH_HOSTNAME:?set AUTH_HOSTNAME}
      MEDIA_HOSTNAME: ${MEDIA_HOSTNAME:?set MEDIA_HOSTNAME}
      MINIO_CONSOLE_HOSTNAME: ${MINIO_CONSOLE_HOSTNAME:?set MINIO_CONSOLE_HOSTNAME}
      KEYCLOAK_UPSTREAM: ${KEYCLOAK_UPSTREAM:-keycloak:8080}
      MINIO_UPSTREAM: ${MINIO_UPSTREAM:-minio:9000}
      MINIO_CONSOLE_UPSTREAM: ${MINIO_CONSOLE_UPSTREAM:-minio:9001}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ${TLS_CERT_PATH:?set TLS_CERT_PATH}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:?set TLS_KEY_PATH}:/etc/nginx/tls/privkey.pem:ro
    depends_on:
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - internal
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    internal: true
  edge:

volumes:
  postgres-data:
  minio-data:
