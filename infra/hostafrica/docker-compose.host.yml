# Host-network local drill for environments where Docker bridge networking is
# unavailable. Production HostAfrica deployments must use docker-compose.yml with
# the isolated `internal` network, not this file.
services:
  postgres:
    network_mode: host
    networks: !reset []
    command:
      [
        "postgres",
        "-c",
        "listen_addresses=127.0.0.1",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-stories_app} -d ${POSTGRES_DB:-stories_of_islam}",
        ]

  keycloak:
    network_mode: host
    networks: !reset []
    command:
      [
        "start",
        "--import-realm",
        "--http-enabled=true",
        "--hostname-strict=false",
        "--http-port=8080",
      ]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://127.0.0.1:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://${AUTH_HOSTNAME}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: "9002"
      KC_PROXY_HEADERS: xforwarded
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9002; echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep 'HTTP/1.1 200' <&3",
        ]

  minio:
    network_mode: host
    networks: !reset []
    command: server /data --address 127.0.0.1:9000 --console-address 127.0.0.1:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: http://127.0.0.1:9000
      MINIO_BROWSER_REDIRECT_URL: http://127.0.0.1:9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]

  minio-init:
    network_mode: host
    networks: !reset []
    environment:
      MINIO_ENDPOINT: http://127.0.0.1:9000

  nginx:
    network_mode: host
    networks: !reset []
    environment:
      AUTH_HOSTNAME: ${AUTH_HOSTNAME:?set AUTH_HOSTNAME}
      MEDIA_HOSTNAME: ${MEDIA_HOSTNAME:?set MEDIA_HOSTNAME}
      MINIO_CONSOLE_HOSTNAME: ${MINIO_CONSOLE_HOSTNAME:?set MINIO_CONSOLE_HOSTNAME}
      KEYCLOAK_UPSTREAM: 127.0.0.1:8080
      MINIO_UPSTREAM: 127.0.0.1:9000
      MINIO_CONSOLE_UPSTREAM: 127.0.0.1:9001
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
