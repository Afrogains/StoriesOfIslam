name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment
        type: choice
        required: true
        options: [staging, production]
        default: staging
      native_builds:
        description: Start signed EAS builds
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  package:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}/api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm run export:web
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_KEYCLOAK_ISSUER: ${{ vars.EXPO_PUBLIC_KEYCLOAK_ISSUER }}
          EXPO_PUBLIC_KEYCLOAK_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_KEYCLOAK_WEB_CLIENT_ID }}
          EXPO_PUBLIC_ENVIRONMENT: ${{ inputs.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ inputs.target }}-${{ github.sha }}
          path: mobile/dist
          if-no-files-found: error

  deploy:
    needs: [package, web]
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - name: Trigger immutable deployment
        env:
          DEPLOY_WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          IMAGE: ${{ needs.package.outputs.image }}
        run: >-
          curl --fail-with-body --retry 3
          -H "Authorization: Bearer ${DEPLOY_TOKEN}"
          -H "Content-Type: application/json"
          --data "{\"image\":\"${IMAGE}\",\"gitSha\":\"${GITHUB_SHA}\",\"runId\":\"${GITHUB_RUN_ID}\"}"
          "${DEPLOY_WEBHOOK}"

  native:
    if: inputs.native_builds
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npx eas-cli@latest build --non-interactive --no-wait --platform all --profile ${{ inputs.target == 'production' && 'production' || 'preview' }}
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_KEYCLOAK_ISSUER: ${{ vars.EXPO_PUBLIC_KEYCLOAK_ISSUER }}
