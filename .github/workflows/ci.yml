name: Validate

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - run: npm run check
        env:
          EXPO_PUBLIC_API_URL: https://api.staging.invalid
          EXPO_PUBLIC_KEYCLOAK_ISSUER: https://auth.staging.invalid/realms/stories-of-islam

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stories_of_islam
          POSTGRES_USER: stories_app
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stories_app -d stories_of_islam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://stories_app:test-only-password@localhost:5432/stories_of_islam
      DATABASE_SSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:migrate

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: stories-of-islam:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  platform-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate WhoGoHost and API host Compose files
        working-directory: infra/whogohost
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password-32chars
          KEYCLOAK_DB_PASSWORD: ci-only-keycloak-db-password-32
          KEYCLOAK_ADMIN_USER: platform-admin
          KEYCLOAK_ADMIN_PASSWORD: ci-only-keycloak-admin-password
          AUTH_HOSTNAME: auth.example.com
          MINIO_ROOT_USER: storage-admin
          MINIO_ROOT_PASSWORD: ci-only-minio-root-password-32chars
          S3_ACCESS_KEY: stories-api
          S3_SECRET_KEY: ci-only-s3-secret-key-32characters
          MEDIA_HOSTNAME: media.example.com
          MINIO_CONSOLE_HOSTNAME: storage-admin.example.com
          TLS_CERT_PATH: /tmp/fullchain.pem
          TLS_KEY_PATH: /tmp/privkey.pem
        run: |
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -keyout "$TLS_KEY_PATH" -out "$TLS_CERT_PATH" \
            -subj "/CN=auth.example.com"
          docker compose -f docker-compose.yml -f docker-compose.host.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.local.yml config >/dev/null
          API_IMAGE=ghcr.io/example/stories-api:ci API_HOSTNAME=api.example.com \
            API_ENV_FILE=.env.example \
            docker compose -f ../api-host/docker-compose.yml config >/dev/null

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
